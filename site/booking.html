<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#172333;font:14px system-ui}.head{border-bottom:1px solid #e6e9eb;padding:20px 25px;display:flex;gap:35px;color:#647286}.active{color:#111}.layout{display:grid;grid-template-columns:1fr 1.2fr;min-height:540px}.form{padding:30px;border-right:1px solid #e6e9eb}h1{font-size:24px;margin-top:0}input,button{font:inherit}input{display:block;width:100%;border:1px solid #d3d8dd;border-radius:5px;padding:14px;margin:15px 0}button{padding:13px 20px;background:#111;color:white;border:0;border-radius:5px;cursor:pointer;width:100%}.cal{padding:30px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;text-align:center}.days span{padding:10px 2px}.days .a{border-radius:50%;background:#f1f4f8;color:#384b5d}.sub{color:#7b8693;font-size:12px;line-height:1.7}.notice{padding:15px;border:1px solid #e0e4e7;border-radius:6px;color:#7c6450;background:#faf9f7;margin-top:24px}@media(max-width:600px){.layout{grid-template-columns:1fr}.form{border-right:0}.cal{display:none}}body{background:transparent}.head,.layout{max-width:810px;margin:auto;background:white}.head{font-size:11px;padding:9px 18px;justify-content:center;border-radius:5px 5px 0 0}.layout{min-height:450px;border-radius:0 0 5px 5px;border:1px solid #e4e7ea}.form{padding:25px}h1{font-size:18px}.cal{padding:23px}.days span{padding:8px 2px}.notice{font-size:11px;margin-top:18px;padding:10px}</style><div class="head"><span class="active">① Fill out the form</span><span>② Book your event</span></div><div class="layout"><div class="form"><h1>STROWGER</h1><p>Environment runtime demo</p><form><input placeholder="Full name" aria-label="Full name" required><input type="email" placeholder="Email" aria-label="Email" required><input placeholder="Company (optional)" aria-label="Company"><p class="sub">Prototype de démonstration. Aucune donnée n’est envoyée ou conservée.</p><button>Continue</button><p class="notice" role="status" hidden></p></form></div><div class="cal"><p>October 2026 <span style="float:right">‹ &nbsp; ›</span></p><div class="days" id="days"></div><div class="notice">Visual prototype · No real appointment can be booked.</div></div></div><script>const d=document.querySelector('#days');['SUN','MON','TUE','WED','THU','FRI','SAT'].forEach(t=>d.insertAdjacentHTML('beforeend','<span class="sub">'+t+'</span>'));for(let i=0;i<4;i++)d.insertAdjacentHTML('beforeend','<span></span>');for(let i=1;i<32;i++)d.insertAdjacentHTML('beforeend','<span class="'+(i>=22?'a':'')+'">'+i+'</span>');document.querySelector('form').onsubmit=e=>{e.preventDefault();const n=document.querySelector('[role=status]');n.hidden=false;n.textContent='Démonstration locale uniquement. Aucun rendez-vous ni envoi réel.'};</script></html>
