[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "strowger-env"
version = "0.1.0"
description = "Environment leases for AI agents: acquire, act, renew, release"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi", "uvicorn", "playwright", "httpx"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["strowger_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
